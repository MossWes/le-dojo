# Le Dojo — à lancer depuis /opt/le-dojo (voir docs/deploiement.md).
# Aucun port publié : seul Traefik (déjà en place, réseau hôte) joint l'app.
services:
  app:
    build: .
    image: le-dojo:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ORIGIN: https://${DOJO_DOMAIN:?DOJO_DOMAIN manquant dans .env}
      # Vraie adresse du visiteur (limitation des essais de connexion), transmise par Traefik.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      LIVRETS_DIR: /app/data/livrets
    volumes:
      - ./data:/app/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.dojo.rule=Host(`${DOJO_DOMAIN}`)
      - traefik.http.routers.dojo.entrypoints=websecure
      - traefik.http.routers.dojo.tls.certresolver=letsencrypt
      - traefik.http.services.dojo.loadbalancer.server.port=3000

  backup:
    build: ./backup
    image: le-dojo-backup:latest
    restart: unless-stopped
    volumes:
      - ./data:/data
      - ./backups:/backups
